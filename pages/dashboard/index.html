<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>王世杰居所助手 · 控制台</title>
  <style>
    :root {
      --bg1: #f3f8ff;
      --bg2: #e8f2fc;
      --accent: #2f7ff0;
      --accent2: #38bdf8;
      --accent-soft: #93c5fd;
      --text: #1f3a56;
      --text-strong: #14304a;
      --muted: #6b88a6;
      --card: linear-gradient(135deg, rgba(255,255,255,0.72), rgba(255,255,255,0.42));
      --card-brd: rgba(255,255,255,0.85);
      --card-shadow: 0 10px 34px rgba(74,128,190,0.18);
      --hi-brd: rgba(47,127,240,0.22);
      --hi-bg: rgba(56,189,248,0.10);
      --radius: 18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 520px at 12% -8%, rgba(96,165,250,0.38), transparent 60%),
        radial-gradient(820px 480px at 96% 4%, rgba(125,211,252,0.34), transparent 55%),
        radial-gradient(760px 620px at 48% 112%, rgba(147,197,253,0.32), transparent 60%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      background-attachment: fixed;
      min-height: 100vh;
      padding: 26px 18px 48px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* 液态玻璃通用面板 */
    .glass {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-brd);
      border-radius: var(--radius);
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.9);
      overflow: hidden;
    }
    /* 顶部高光，制造液体光泽感 */
    .glass::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%);
      pointer-events: none;
    }

    .wrap { max-width: 1180px; margin: 0 auto; }

    /* Hero */
    .hero {
      display: flex; align-items: center; gap: 16px;
      padding: 18px 22px; margin-bottom: 20px;
    }
    .hero .logo {
      width: 58px; height: 58px; border-radius: 16px; object-fit: cover;
      box-shadow: 0 0 0 1px rgba(47,127,240,0.3), 0 6px 18px rgba(74,128,190,0.25);
      flex: 0 0 auto;
    }
    .hero .logo-fallback {
      width: 58px; height: 58px; border-radius: 16px; flex: 0 0 auto;
      display: grid; place-items: center; font-size: 30px;
      background: linear-gradient(135deg, var(--accent2), #bfdbfe);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);
    }
    .hero h1 { font-size: 21px; font-weight: 700; letter-spacing: 0.5px; color: var(--text-strong); }
    .hero-main { flex: 1 1 auto; min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .hero .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
    .hero .sub b { color: var(--accent); font-weight: 600; }
    .hero .badge {
      margin-left: 0; align-self: center;
      font-size: 11px; color: var(--accent);
      border: 1px solid rgba(47,127,240,0.35);
      background: rgba(56,189,248,0.16);
      padding: 3px 9px; border-radius: 999px; white-space: nowrap;
    }

    /* Section title */
    .sec-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; color: var(--text-strong);
      margin: 22px 4px 12px;
    }
    .sec-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent2); }
    .sec-title .hint { color: var(--muted); font-size: 11.5px; font-weight: 400; margin-left: 10px; white-space: nowrap; }
    /* Heat tabs */
    .tabs { display: flex; gap: 6px; margin: 2px 0 12px; }
    .tab {
      flex: 1; cursor: pointer; text-align: center;
      border: 1px solid var(--card-brd); background: rgba(255,255,255,0.5);
      color: var(--muted); border-radius: 10px; padding: 7px 0;
      font-size: 13px; font-weight: 600; transition: all 0.15s ease;
    }
    .tab:hover { color: var(--accent); border-color: rgba(47,127,240,0.4); }
    .tab.active {
      color: #fff; border-color: transparent;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 16px rgba(47,127,240,0.3), inset 0 1px 0 rgba(255,255,255,0.45);
    }

    /* Stat cards */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .stat {
      background: var(--card); border: 1px solid var(--card-brd);
      border-radius: 14px; padding: 16px 16px 14px;
      backdrop-filter: blur(18px) saturate(170%);
      -webkit-backdrop-filter: blur(18px) saturate(170%);
      box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.9);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .stat:hover { transform: translateY(-3px); box-shadow: 0 16px 40px rgba(74,128,190,0.26), inset 0 1px 0 rgba(255,255,255,0.9); }
    .stat .ic { font-size: 18px; }
    .stat .num { font-size: 26px; font-weight: 700; margin-top: 6px; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat .lbl { font-size: 11.5px; color: var(--muted); margin-top: 3px; }

    /* Two-column grid —— stretch 让左右卡片自动等高 */
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--card-brd);
      border-radius: var(--radius); padding: 16px 18px;
      backdrop-filter: blur(22px) saturate(180%);
      -webkit-backdrop-filter: blur(22px) saturate(180%);
      box-shadow: var(--card-shadow), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    /* Heat bars */
    .bar { margin: 11px 0; }
    .bar .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12.5px; margin-bottom: 5px; }
    .bar .top .nm { color: var(--text-strong); font-weight: 500; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar .top .ct { color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; flex: 0 0 auto; white-space: nowrap; }
    .bar .track { height: 8px; border-radius: 999px; background: rgba(120,160,200,0.18); overflow: hidden; }
    .bar .fill {
      height: 100%; width: 0; border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 0 10px rgba(56,189,248,0.5);
      transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .empty { color: var(--muted); font-size: 12.5px; padding: 14px 2px; text-align: center; }

    /* High records —— 原生 <table>，固定列宽比例，严格对齐 */
    .hi-tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .hi-tbl col:nth-child(1) { width: 22%; }
    .hi-tbl col:nth-child(2) { width: 28%; }
    .hi-tbl col:nth-child(3) { width: 25%; }
    .hi-tbl col:nth-child(4) { width: 25%; }
    .hi-tbl thead { border-bottom: 2px solid rgba(47,127,240,0.18); }
    .hi-tbl th { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-align: left; padding: 0 8px 10px; }
    .hi-tbl th:first-child { text-align: left; }
    .hi-tbl th:nth-child(2), .hi-tbl th:nth-child(3) { text-align: left; }
    .hi-tbl th:last-child { text-align: left; }
    .hi-tbl td { font-size: 13px; padding: 10px 8px; vertical-align: middle; border-top: 1px solid rgba(47,127,240,.10); }
    .hi-tbl tr:first-child td { border-top: none; }
    .hi-tbl td.nm { font-weight: 600; color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; }
    .hi-tbl td.inc { font-size: 15px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; text-align: left; white-space: nowrap; font-family: "Courier New", Consolas, monospace; letter-spacing: .02em; }
    .hi-tbl td.sub { font-size: 13px; color: var(--text-strong); font-variant-numeric: tabular-nums; text-align: left; white-space: nowrap; font-family: "Courier New", Consolas, monospace; }
    .hi-tbl td.dt { font-size: 12px; color: var(--muted); text-align: left; white-space: nowrap; }

    /* Config */
    .cfg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .cfg-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-radius: 12px;
      background: rgba(255,255,255,0.5); border: 1px solid var(--card-brd);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .cfg-ic { font-size: 15px; line-height: 1; }
    .cfg-lb { flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: var(--text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cfg-item .st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
    .cfg-item .st.on { color: var(--accent); background: rgba(56,189,248,0.16); }
    .cfg-item .st.off { color: #e0457b; background: rgba(224,69,123,0.10); }
    .cfg-item .st.val { color: var(--accent); background: rgba(56,189,248,0.13); font-weight: 600; }
    .cfg-item .st .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

    /* 各作物播报阈值（配置速览底部） */
    .thr { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--card-brd); }
    .thr-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 12.5px; font-weight: 700; color: var(--text-strong); margin-bottom: 10px; }
    .thr-sub { font-size: 10.5px; font-weight: 500; color: var(--muted); }
    .thr-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .thr-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 11px; border-radius: 10px;
      background: rgba(255,255,255,0.5); border: 1px solid var(--card-brd);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .thr-nm { font-size: 12px; font-weight: 600; color: var(--text-strong); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thr-val { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; font-variant-numeric: tabular-nums; }

    .footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 30px; }
    .sdk-warn { padding: 30px; text-align: center; color: #e0457b; }
    .preview-bar { background: rgba(255,193,7,0.14); border: 1px solid rgba(214,158,0,0.4); color: #8a6d00; font-size: 12px; padding: 9px 14px; border-radius: 12px; margin-bottom: 14px; text-align: center; }

    /* 大屏（≥1280）：放宽主容器、卡片更舒展，避免两侧空旷 */
    @media (min-width: 1280px) {
      body { padding: 34px 24px 56px; }
      .wrap { max-width: 1200px; }
      .hero { padding: 22px 28px; }
      .hero h1 { font-size: 23px; }
      .card { padding: 20px 22px; }
      .stat { padding: 18px 20px 16px; }
      .stat .num { font-size: 28px; }
      .cfg { gap: 12px; }
    }
    /* 中小屏：主容器贴边 */
    @media (max-width: 900px) {
      .wrap { max-width: 100%; }
    }
    /* 手机横屏 / 大手机 */
    @media (max-width: 720px) {
      body { padding: 16px 14px 40px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .grid2 { grid-template-columns: 1fr; gap: 12px; }
      .cfg { grid-template-columns: repeat(3, 1fr); gap: 9px; }
      .hi-tbl td.nm { font-size: 12.5px; }
      .hero { flex-wrap: wrap; gap: 12px; padding: 14px 16px; }
      .hero .logo, .hero .logo-fallback { width: 46px; height: 46px; font-size: 24px; }
      .hero h1 { font-size: 18px; }
      .hero .sub { font-size: 11px; }
      .hero .badge { margin-left: 0; }
      .sec-title { font-size: 13px; flex-wrap: wrap; }
      /* 标题与「数据自 … 起」提示在窄屏分两行，避免挤压 */
      .sec-title .hint { margin-left: 0; font-size: 11px; white-space: nowrap; }
      .card { padding: 14px; }
      .stat { padding: 13px 12px 11px; }
      .stat .num { font-size: 22px; }
      .bar { margin: 9px 0; }
      .bar .top { font-size: 12px; }
    }
    /* 小手机 */
    @media (max-width: 480px) {
      body { padding: 12px 10px 34px; }
      .hero { padding: 12px 14px; gap: 10px; }
      .hero h1 { font-size: 16.5px; }
      .stats { gap: 8px; }
      .stat { padding: 11px 9px 10px; }
      .stat .num { font-size: 20px; }
      .stat .lbl { font-size: 10.5px; }
      .sec-title { margin: 18px 2px 10px; }
      .card { padding: 12px; }
      .cfg { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      .cfg-item { padding: 8px 10px; gap: 6px; }
      .cfg-lb { font-size: 11.5px; }
      .cfg-ic { font-size: 13px; }
      .thr { margin-top: 12px; padding-top: 11px; }
      .thr-list { grid-template-columns: repeat(2, 1fr); gap: 7px; }
      .thr-item { padding: 7px 9px; }
      /* 超窄屏下历史最高价表格更紧凑 */
      .hi-tbl { font-size: 12px; }
      .hi-tbl col:nth-child(1) { width: 26%; }
      .hi-tbl col:nth-child(2) { width: 26%; }
      .hi-tbl col:nth-child(3) { width: 24%; }
      .hi-tbl col:nth-child(4) { width: 24%; }
      .hi-tbl th { font-size: 11px; padding: 0 6px 8px; }
      .hi-tbl td { padding: 8px 6px; }
      .hi-tbl td.inc { font-size: 13px; }
      .hi-tbl td.sub, .hi-tbl td.dt { font-size: 11px; }
    }
    /* 超窄屏（≤380，如 iPhone SE） */
    @media (max-width: 380px) {
      .hero h1 { font-size: 15.5px; }
      .stat .num { font-size: 19px; }
      .cfg { grid-template-columns: repeat(2, 1fr); gap: 7px; }
      .cfg-lb { font-size: 11px; white-space: normal; }
    }
  </style>
</head>

  </div>

  <script type="module">
    (async function () {
      const statsEl = document.getElementById("stats");
      const heatEl = document.getElementById("heat");
      const highEl = document.getElementById("high");
      const cfgEl = document.getElementById("cfg");

      // 官方文档（AstrBot v4.24.1 Plugin Pages）：bridge SDK 由服务端注入到
      // 本 iframe 自身的 window.AstrBotPluginPage，且仅注入本窗口；受限 iframe 下
      // window.parent 为跨域，读取其属性会抛 SecurityError，【绝对不要】访问 window.parent。
      // 用 type="module" 让本脚本延迟到 SDK 注入之后执行，再用轮询兜底。
      function getBridge() {
        return window.AstrBotPluginPage || null;
      }
      // 演示/调试模式数据：无 bridge 时用示例渲染，避免「桥接未就绪」阻断 UI
      const MOCK = {
        overview: {
          plugin: "王世杰居所助手", version: "1.12", data_since: "2026-07-12", author: "亭子ww",
          stats: { total_queries: 1287, top_crop: "星夜龙眼", top_count: 213, crop_kinds: 24, monitored: 7, high_records: 18, 录入_data: 856, polling_on: true },
          sources: { source1: true, source2: true, source3: false },
          recall_seconds: 30,
          thresholds: {
            "炎霞辣椒": 500000, "灿金云棉": 1000000, "曳紫云棉": 2000000,
            "旭日辣椒": 3000000, "胭纱云棉": 4000000, "星夜龙眼": 6500000, "蝶影莲子": 8000000
          },
          config: {
            poll_interval_minutes: 3,
            monitored_crops: 7,
            custom_reply_on: true,
            rate_limit_window: 600,
            rate_limit_max: 3,
            configured_groups: 2,
            whitelist_on: true,
            whitelist_crop_detect: true,
            whitelist_at_reply: true,
            whitelist_merchant_reply: true,
          }
        },
        heat: {
          total: [
            { crop: "星夜龙眼", count: 213 }, { crop: "旭日辣椒", count: 168 },
            { crop: "胭纱云棉", count: 142 }, { crop: "碧波莲藕", count: 97 },
            { crop: "金穗麦", count: 64 }, { crop: "霜落葡萄", count: 41 }
          ],
          daily: [
            { crop: "星夜龙眼", count: 18 }, { crop: "胭纱云棉", count: 12 },
            { crop: "碧波莲藕", count: 9 }, { crop: "霜落葡萄", count: 5 }
          ],
          weekly: [
            { crop: "星夜龙眼", count: 96 }, { crop: "旭日辣椒", count: 71 },
            { crop: "胭纱云棉", count: 53 }, { crop: "金穗麦", count: 30 }
          ],
        },
        high: { items: [
          { crop: "星夜龙眼", quantity: 12, income: "38.6", ts: Math.floor(Date.now() / 1000) - 86400 * 2 },
          { crop: "旭日辣椒", quantity: 8, income: "31.2", ts: Math.floor(Date.now() / 1000) - 86400 * 5 },
          { crop: "胭纱云棉", quantity: 15, income: "27.9", ts: Math.floor(Date.now() / 1000) - 86400 * 9 }
        ], total: 3 }
      };
      let curPeriod = "total";
      let heatData = null;  // { daily:[], weekly:[], total:[] }
      function renderMock() {
        renderOverview(MOCK.overview);
        heatData = MOCK.heat;
        showPeriod(curPeriod);
        renderHigh(MOCK.high);
      }
      // 仅拉取一次：三个区间数据一并返回，切换标签时本地渲染、零网络等待
      async function loadHeatData() {
        if (bridge) {
          try {
            const r = await bridge.apiGet("page/crop-heat");
            heatData = r || {};
            showPeriod(curPeriod);
          } catch (e) {
            heatEl.innerHTML = '<div class="empty">热度加载失败：' + esc(e && e.message ? e.message : e) + '</div>';
          }
        } else {
          heatData = MOCK.heat;
          showPeriod(curPeriod);
        }
      }
      // 切换标签（日/周/总）：仅本地重渲染已加载的数据；未加载则触发一次拉取
      function showPeriod(period) {
        curPeriod = period || "total";
        document.querySelectorAll("#heatTabs .tab").forEach((t) => {
          t.classList.toggle("active", t.dataset.period === curPeriod);
        });
        if (!heatData) { loadHeatData(); return; }
        renderHeat(heatData[curPeriod] || []);
      }
      function showPreviewBar(msg) {
        let bar = document.getElementById("previewBar");
        if (!bar) {
          bar = document.createElement("div");
          bar.id = "previewBar";
          bar.className = "preview-bar";
          const wrap = document.querySelector(".wrap");
          if (wrap) wrap.insertBefore(bar, wrap.firstChild);
        }
        bar.textContent = msg;
        bar.style.display = "block";
      }
      function hidePreviewBar() {
        const bar = document.getElementById("previewBar");
        if (bar) bar.style.display = "none";
      }
      async function startReal(b) {
        try { await b.ready(); } catch (e) { console.error("bridge.ready 失败，继续尝试加载真实数据:", e); }
        const fail = (el, label) => (e) => {
          console.error("[居所] " + label + " 加载失败:", e);
          el.innerHTML = '<div class="empty">' + label + "加载失败：" + esc(e && e.message ? e.message : e) + "</div>";
        };
        b.apiGet("page/overview").then(renderOverview).catch(fail(statsEl, "概览"));
        loadHeatData();
        b.apiGet("page/high-records").then(renderHigh).catch(fail(highEl, "最高价"));
      }
      const fmtDate = (ts) => {
        if (!ts) return "";
        const d = new Date(ts * 1000);
        const p = (n) => String(n).padStart(2, "0");
        return p(d.getMonth() + 1) + "-" + p(d.getDate());
      };
      const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
      // 标签点击监听：必须写在 return; 之前，否则永远不生效
      document.querySelectorAll("#heatTabs .tab").forEach((t) => {
        t.addEventListener("click", () => showPeriod(t.dataset.period));
      });
      const bridge = getBridge();
      if (bridge) {
        await startReal(bridge);
      } else {
        // 无 bridge（本地调试 / 尚未注入）：先用示例数据渲染，后台轮询等待注入后切换真实数据
        renderMock();
        showPreviewBar("当前为本地预览（未连接 AstrBot 桥接），以下为示例数据。在 AstrBot WebUI 的插件详情页打开本页面将加载真实数据。");
        (function poll() {
          const bb = getBridge();
          if (bb) { hidePreviewBar(); startReal(bb); return; }
          setTimeout(poll, 300);
        })();
      }
      return;

      function renderOverview(ov) {
        if (!ov) return;
        if (ov.version) document.getElementById("verBadge").textContent = "v" + ov.version;
        if (ov.data_since) document.getElementById("sinceHint").textContent = "数据自 " + ov.data_since + " 起";
        const s = (ov.stats || {});
        const topName = s.top_crop || "";
        const topCount = s.top_count || 0;
        const cards = [
          { ic: "🔎", num: s.total_queries ?? 0, lbl: "累计查询次数" },
          { ic: "🌾", num: topName || "暂无", lbl: topName ? ("查询最多的作物 · " + topCount + " 次") : "查询最多的作物" },
          { ic: "🗂️", num: s.录入_data ?? 0, lbl: "已录入数据" },
        ];
        statsEl.innerHTML = cards.map((c) =>
          '<div class="stat"><div class="ic">' + c.ic + '</div>' +
          '<div class="num">' + c.num + '</div>' +
          '<div class="lbl">' + c.lbl + '</div></div>'
        ).join("");

        const src = ov.sources || {};
        const cfg = ov.config || {};
        const rlWin = Math.floor((cfg.rate_limit_window || 600) / 60);
        const rlMax = cfg.rate_limit_max || 3;
        const cfgItems = [
          // —— 数据源 ——
          { ic: "🏠", label: "源1 · 居所站", type: "switch", on: src.source1 },
          { ic: "🌐", label: "源2 · HOK站", type: "switch", on: src.source2 },
          { ic: "🏡", label: "源3 · 家园站", type: "switch", on: src.source3 },
          // —— 播报与召回 ——
          { ic: "🔄", label: "后台轮询播报", type: "switch", on: s.polling_on },
          { ic: "↩️", label: "查询结果撤回", type: "switch", on: (ov.recall_seconds || 0) > 0, val: (ov.recall_seconds || 0) + "s" },
          // —— 轮询与监控 ——
          { ic: "📡", label: "轮询间隔", type: "num", text: "每 " + (cfg.poll_interval_minutes || 3) + " 分钟" },
          { ic: "🌱", label: "监控作物数", type: "num", text: (cfg.monitored_crops || 0) + " 种" },
          { ic: "💬", label: "自定义回复", type: "switch", on: !!cfg.custom_reply_on },
          // —— 限流与群 ——
          { ic: "🛡️", label: "QQ查询限流", type: "num", text: rlWin + "分钟" + rlMax + "次" },
          { ic: "👥", label: "群独立配置", type: "num", text: (cfg.configured_groups || 0) + " 个群" },
          // —— 白名单响应 ——
          { ic: "🌾", label: "白名单·作物播报", type: "switch", on: !!cfg.whitelist_crop_detect },
          { ic: "📣", label: "白名单·@回复", type: "switch", on: !!cfg.whitelist_at_reply },
        ];
        cfgEl.innerHTML = cfgItems.map((it) => {
          let st;
          if (it.type === "switch") {
            st = it.on
              ? '<span class="st on"><i class="dot"></i>' + (it.val ? esc(it.val) : "已开启") + '</span>'
              : '<span class="st off"><i class="dot"></i>已关闭</span>';
          } else {
            st = '<span class="st val">' + esc(it.text) + '</span>';
          }
          return '<div class="cfg-item">' +
            '<span class="cfg-ic">' + it.ic + '</span>' +
            '<span class="cfg-lb">' + esc(it.label) + '</span>' + st + '</div>';
        }).join("");

        // 各作物播报阈值（配置速览底部）
        const thrEl = document.getElementById("thr");
        if (thrEl) {
          const thr = ov.thresholds || {};
          const keys = Object.keys(thr);
          if (keys.length) {
            thrEl.innerHTML = keys.map((crop) => {
              const t = thr[crop] || 0;
              const wan = Math.round(t / 10000);
              return '<div class="thr-item">' +
                '<span class="thr-nm">🌾 ' + esc(crop) + '</span>' +
                '<span class="thr-val">≥' + wan + '万</span></div>';
            }).join("");
          } else {
            thrEl.innerHTML = '<div class="empty">暂无阈值数据</div>';
          }
        }
      }

      function renderHeat(items) {
        items = items || [];
        if (!items.length) { heatEl.innerHTML = '<div class="empty">暂无查询记录</div>'; return; }
        const max = Math.max.apply(null, items.map((i) => i.count)) || 1;
        heatEl.innerHTML = items.map((i) =>
          '<div class="bar"><div class="top"><span class="nm">🌾 ' + esc(i.crop) + '</span>' +
          '<span class="ct">' + i.count + ' 次</span></div>' +
          '<div class="track"><div class="fill" data-w="' + Math.round((i.count / max) * 100) + '"></div></div></div>'
        ).join("");
        requestAnimationFrame(() => {
          heatEl.querySelectorAll(".fill").forEach((el) => { el.style.width = el.dataset.w + "%"; });
        });
      }

            function renderHigh(h) {
        const items = (h && h.items) || [];
        if (!items.length) { highEl.innerHTML = '<tbody><tr><td colspan="4" class="empty">暂无历史最高记录</td></tr></tbody>'; return; }
        // 百工币格式：严格 3 位整数(补零)+1 位小数，如 036.9 / 805.0
        function fmtBgb(v) { const n = parseFloat(v); if (isNaN(n)) return String(v); const s = n.toFixed(1); const p = s.split('.'); return p[0].padStart(3,'0') + '.' + p[1]; }
        let html = '<colgroup><col><col><col><col></colgroup>';
        html += '<thead><tr><th>作物</th><th>最高价</th><th>数量</th><th>日期</th></tr></thead><tbody>';
        for (const r of items) {
          const dt = r.ts ? (fmtDate(r.ts) || '') : '';
          html += '<tr>' +
                    '<td class="nm">' + esc(r.crop) + '</td>' +
                    '<td class="inc">' + fmtBgb(r.income) + '</td>' +
                    '<td class="sub">' + (r.quantity || 0) + '</td>' +
                    '<td class="dt">' + (dt || '—') + '</td>' +
                  '</tr>';
        }
        html += '</tbody>';
        highEl.innerHTML = html;
      }

    })();
  </script>
</body>
</html>
